<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Tepaseo.cl{% endblock %}
    </title>
</head>

<body>

    <header>
        <nav>
            <a href="{{ url_for('public.index') }}">
                Inicio
            </a>

            <a href="{{ url_for('public.servicios') }}">
                Servicios
            </a>

            <a href="{{ url_for('public.cobertura') }}">
                Cobertura
            </a>

            <a href="{{ url_for('public.solicitar_paseo') }}">
                Solicitar paseo
            </a>

            <a href="{{ url_for('public.postulacion') }}">
                Trabaja con nosotros
            </a>
        </nav>
    </header>

    <main>

        {% for categoria, mensaje in
            get_flashed_messages(with_categories=true) %}

            <p role="status" class="{{ categoria }}"
               style="color: green;">
                {{ mensaje }}
            </p>

        {% endfor %}

        {% block content %}

        {% endblock %}

    </main>

    <footer>
        <p>
            Tepaseo.cl - Proyecto Integrador ACI 2026
        </p>
    </footer>

</body>
</html>
